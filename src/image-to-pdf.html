<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多图转 PDF · 图片合并制作工具</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f8f9f8;
      --surface: #fff;
      --ink: #202724;
      --muted: #737b76;
      --line: #e1e6e2;
      --accent: #126350;
      --accent-dark: #0b4d3e;
      --tint: #eef7f2;
      --error: #963f2e;
      font: 15px/1.6 "Microsoft YaHei UI", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: default; }
    button:focus-visible, input:focus-visible, .option:has(input:focus-visible) {
      outline: 3px solid #427f72;
      outline-offset: 3px;
    }

    .shell { width: min(1160px, calc(100% - 64px)); margin-inline: auto; }
    .masthead { border-bottom: 1px solid var(--line); background: var(--surface); }
    .masthead-inner { min-height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand, .local-badge { display: flex; align-items: center; gap: 9px; white-space: nowrap; }
    .brand { font-size: 18px; font-weight: 700; letter-spacing: -.03em; }
    .brand-mark { display: grid; place-items: center; width: 36px; height: 36px; color: var(--accent); }
    .local-badge { font-size: 12px; color: var(--muted); }

    main { padding-block: 36px 28px; }
    .hero { text-align: center; margin-bottom: 30px; }
    h1 { margin: 0; font-size: clamp(1.8rem, 3.5vw, 2.5rem); line-height: 1.3; letter-spacing: -.04em; font-weight: 700; }
    .hero-copy { color: var(--muted); margin: 9px 0 0; }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(310px, 1fr); align-items: stretch; gap: 18px; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 23px; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
    h2 { font-size: 20px; margin: 0; font-weight: 700; }
    .count { font-size: 14px; font-weight: 600; white-space: nowrap; }
    .material-toolbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }

    .drop-zone { display: grid; justify-items: center; gap: 5px; text-align: center; background: #fafbfa; border: 1px dashed #c8d1cb; border-radius: 9px; padding: 18px 12px; margin-bottom: 14px; }
    .drop-zone.is-over { background: var(--tint); border-color: var(--accent); outline: 2px solid var(--accent); }
    .upload-icon { display: grid; place-items: center; color: #8a9790; }
    .drop-zone p { margin: 0; }
    .drop-title { font-size: 13px; color: var(--muted); }
    .formats { font-size: 11px; color: #8b938e; }
    .pick-button { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); border-radius: 7px; background: var(--surface); color: var(--ink); padding: 7px 13px; font-size: 13px; font-weight: 500; }
    #pick-button { border-color: #719f8d; color: var(--accent); font-weight: 600; }
    .pick-button:hover:not(:disabled), .icon-button:hover:not(:disabled) { background: var(--tint); border-color: var(--accent); }
    .pick-button:disabled { opacity: .45; }
    .import-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .list-tools { display: flex; gap: 4px; margin-left: auto; }
    .list-tools .text-button { padding-inline: 7px; border-color: transparent; color: var(--muted); background: transparent; }
    .text-button { padding: 5px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; color: var(--accent-dark); font-size: 12px; }
    .text-button:hover:not(:disabled) { background: var(--tint); }
    .text-button:disabled { opacity: .45; }

    .order-hint { margin: 10px 0; color: var(--muted); font-size: 11px; }
    .empty-state { margin: 18px 0; text-align: center; color: var(--muted); font-size: 12px; }
    .preview-hint { color: var(--muted); font-size: 11px; margin: 12px 0 0; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .image-list { margin: -3px; padding: 3px; list-style: none; display: grid; max-height: 360px; overflow: auto; }
    .image-row { display: grid; grid-template-columns: 30px 64px minmax(0, 1fr) auto; align-items: center; gap: 12px; position: relative; min-height: 88px; border-bottom: 1px solid #edf0ed; padding: 11px 1px; }
    .image-row:last-child { border-bottom: 0; }
    .image-row.dragging { opacity: .48; }
    .image-row.drop-before { box-shadow: 0 -3px 0 var(--accent); }
    .image-row.drop-after { box-shadow: 0 3px 0 var(--accent); }
    .drag-handle { display: flex; align-items: center; gap: 3px; font-size: 11px; line-height: 1; color: var(--muted); cursor: grab; }
    .drag-handle[draggable="false"] { cursor: default; }
    .thumbnail-button { width: 64px; height: 64px; border: 0; border-radius: 7px; padding: 2px; background: #f1f3f1; overflow: hidden; }
    .thumbnail { width: 100%; height: 100%; object-fit: contain; display: block; }
    .file-name { display: block; font-size: 13px; font-weight: 500; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .file-meta { display: block; margin-top: 3px; font-size: 11px; color: var(--muted); }
    .row-actions { display: flex; gap: 4px; }
    .icon-button { width: 28px; height: 32px; padding: 0; display: grid; place-items: center; border: 1px solid transparent; background: var(--surface); color: #7a847d; border-radius: 6px; }
    .icon-button:disabled { opacity: .35; }
    .icon-button[data-action="remove"]:hover:not(:disabled) { background: #fff0eb; border-color: #c7a498; }

    fieldset { border: 0; padding: 0; margin: 0; min-inline-size: 0; }
    legend, .input-label { font-size: 13px; font-weight: 500; margin-bottom: 10px; padding: 0; }
    .options { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .option { display: flex; align-items: center; gap: 8px; position: relative; border: 1px solid var(--line); border-radius: 7px; padding: 10px; color: var(--ink); font-size: 12px; cursor: pointer; }
    .option:has(input:checked) { border-color: #b1d2c1; color: var(--accent-dark); background: var(--tint); }
    .option input { margin: 0; accent-color: var(--accent); }
    .option:has(input:disabled) { cursor: default; opacity: .65; }
    .option-copy { margin: 10px 0 25px; min-height: 2.9em; color: var(--muted); font-size: 11px; }
    .input-label { display: block; }
    .filename-field { display: flex; align-items: stretch; margin-bottom: 32px; }
    .filename-field input { min-width: 0; width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-right: 0; border-radius: 8px 0 0 8px; color: var(--ink); background: var(--surface); }
    .filename-field input:focus-visible { z-index: 1; }
    .suffix { display: grid; place-items: center; border: 1px solid var(--line); border-radius: 0 8px 8px 0; padding-inline: 10px; background: #f6f7f3; color: var(--muted); font-size: 12px; }
    .export-button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 12px; border: 0; border-radius: 7px; color: white; background: var(--accent); font-weight: 600; }
    .export-button:hover:not(:disabled) { background: var(--accent-dark); }
    .export-button:disabled { background: #e9ece6; color: #63746b; }
    .progress-box { margin-top: 10px; }
    .progress-box progress { display: block; width: 100%; height: 8px; accent-color: var(--accent); }
    .export-hint { margin: 9px 0 0; text-align: center; color: var(--muted); font-size: 11px; }
    .notice { margin: 9px 0 0; font-size: 12px; color: var(--accent-dark); overflow-wrap: anywhere; }
    .notice:empty { display: none; }
    .notice[data-tone="error"] { color: var(--error); }
    #preview-dialog { width: min(900px, calc(100% - 32px)); max-height: 92vh; padding: 20px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); background: var(--surface); }
    #preview-dialog::backdrop { background: #172b2bb3; }
    .preview-heading { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    #preview-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 15px; }
    #preview-close { flex-shrink: 0; white-space: nowrap; }
    .preview-stage { height: min(56vh, 520px); display: grid; place-items: center; background: #f1f2ee; border-radius: 8px; overflow: hidden; }
    #preview-canvas { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; }
    .preview-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
    .preview-navigation { display: flex; align-items: center; gap: 10px; }
    #preview-position { color: var(--muted); font-size: 12px; }
    .footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; margin-top: 17px; color: var(--muted); font-size: 12px; }

    @media (max-width: 760px) {
      .shell { width: calc(100% - 32px); }
      .masthead-inner { min-height: 58px; }
      main { padding-block: 32px 28px; }
      .hero { margin-bottom: 20px; }
      .layout { grid-template-columns: 1fr; gap: 13px; }
      .panel { padding: 16px; }
      .image-list { max-height: 300px; }
      .hero-copy { font-size: 13px; }
    }
    @media (max-width: 390px) {
      .shell { width: calc(100% - 22px); }
      .panel { padding: 12px; }
      .image-row { gap: 7px; grid-template-columns: 24px 44px minmax(0, 1fr) auto; }
      .thumbnail-button { width: 44px; height: 44px; }
      .icon-button { width: 24px; }
      .row-actions { gap: 1px; }
      .file-name { font-size: 12px; }
      .material-toolbar { gap: 12px; }
      .list-tools { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute">
    <defs>
      <symbol id="icon-brand" viewBox="0 0 24 24"><path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/></symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3M12 16V4m-5 5 5-5 5 5"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3M12 4v12m-5-5 5 5 5-5"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-up" viewBox="0 0 24 24"><path d="m6 14 6-6 6 6"/></symbol>
      <symbol id="icon-down" viewBox="0 0 24 24"><path d="m6 10 6 6 6-6"/></symbol>
      <symbol id="icon-remove" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7m4-7v7"/></symbol>
      <symbol id="icon-grip" viewBox="0 0 24 24"><path d="M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01" stroke-width="3"/></symbol>
    </defs>
  </svg>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand"><span class="brand-mark"><svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-brand"/></svg></span>多图转 PDF</div>
      <span class="local-badge">离线运行 · 图片留在本机</span>
    </div>
  </header>
  <main class="shell">
    <div class="hero">
      <h1>图片合并成 PDF</h1>
      <p class="hero-copy">添加图片，调整顺序，导出一份 PDF</p>
    </div>

    <div class="layout">
      <section class="panel" aria-labelledby="images-heading">
        <div class="panel-heading">
          <h2 class="sr-only" id="images-heading">待合并图片</h2>
          <span class="count" id="image-count" aria-live="polite">0 张图片</span>
        </div>
        <div class="material-toolbar">
          <div class="import-actions">
            <button class="pick-button" type="button" id="pick-button"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><use href="#icon-plus"/></svg>选择图片</button>
            <button class="pick-button" type="button" id="paste-button">粘贴截图</button>
          </div>
          <div class="list-tools" id="list-tools" hidden>
            <button class="text-button" type="button" id="sort-button">按文件名排序</button>
            <button class="text-button" type="button" id="clear-button">清空</button>
          </div>
        </div>
        <div class="drop-zone" id="drop-zone">
          <span class="upload-icon"><svg width="27" height="27" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-upload"/></svg></span>
          <p class="drop-title">拖入图片，也可按 Ctrl+V 或 ⌘V 粘贴</p>
          <p class="formats">JPG · PNG · WebP · BMP</p>
        </div>
        <input type="file" id="file-input" multiple accept=".jpg,.jpeg,.jfif,.png,.webp,.bmp,image/jpeg,image/png,image/webp,image/bmp" hidden>
        <p class="notice" id="file-notice" role="status"></p>
        <p class="order-hint" id="order-hint" hidden>拖动序号或使用箭头调整页序</p>
        <ol class="image-list" id="image-list" aria-label="PDF 页面顺序" hidden></ol>
        <p class="empty-state" id="empty-state">选择图片后，每张图片会生成一页。</p>
        <p class="preview-hint">点击缩略图可预览和旋转</p>
      </section>

      <section class="panel" aria-labelledby="export-heading">
        <div class="panel-heading"><h2 id="export-heading">导出设置</h2></div>
        <fieldset id="page-options" aria-describedby="option-copy">
          <legend>页面规格</legend>
          <div class="options">
            <label class="option"><input type="radio" name="page-mode" id="page-auto" value="auto" checked>A4 自动方向</label>
            <label class="option"><input type="radio" name="page-mode" id="page-portrait" value="portrait">A4 竖版</label>
            <label class="option"><input type="radio" name="page-mode" id="page-landscape" value="landscape">A4 横版</label>
            <label class="option"><input type="radio" name="page-mode" id="page-image" value="image">按图片比例</label>
          </div>
        </fieldset>
        <p class="option-copy" id="option-copy">每页按图片方向选择横版或竖版，等比缩放并居中。</p>
        <label class="input-label" for="pdf-name">文件名</label>
        <div class="filename-field"><input id="pdf-name" type="text" value="合并图片" placeholder="合并图片" maxlength="80" autocomplete="off" spellcheck="false"><span class="suffix" aria-hidden="true">.pdf</span></div>
        <button class="export-button" type="button" id="export-button" disabled><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#icon-download"/></svg><span id="export-label">生成并下载 PDF</span></button>
        <div class="progress-box" id="progress-box" hidden><progress id="progress" value="0" max="1" aria-label="生成进度"></progress></div>
        <p class="notice" id="notice" role="status"></p>
        <p class="export-hint">透明区域会以白底显示。</p>
      </section>
    </div>
    <div class="footer"><span>双击本文件，即可在浏览器中离线使用。</span><span>导出时会压缩图片，超大图片会缩小。</span></div>
  </main>
  <dialog id="preview-dialog" aria-labelledby="preview-title">
    <div class="preview-heading">
      <h2 id="preview-title">图片预览</h2>
      <button class="text-button" type="button" id="preview-close">关闭</button>
    </div>
    <div class="preview-stage"><canvas id="preview-canvas" aria-label="图片预览"></canvas></div>
    <p class="notice" id="preview-notice" role="status"></p>
    <div class="preview-actions">
      <button class="text-button" type="button" id="rotate-button">顺时针旋转 90°</button>
      <div class="preview-navigation">
        <button class="text-button" type="button" id="preview-prev">上一张</button>
        <span id="preview-position"></span>
        <button class="text-button" type="button" id="preview-next">下一张</button>
      </div>
    </div>
  </dialog>
  <noscript><p class="shell">请启用浏览器的 JavaScript 以使用此工具。</p></noscript>

  <script>
  'use strict';

  /* PDF_ENGINE */

  const fileInput = document.querySelector('#file-input');
  const dropZone = document.querySelector('#drop-zone');
  const pickButton = document.querySelector('#pick-button');
  const pasteButton = document.querySelector('#paste-button');
  const sortButton = document.querySelector('#sort-button');
  const clearButton = document.querySelector('#clear-button');
  const listTools = document.querySelector('#list-tools');
  const fileNotice = document.querySelector('#file-notice');
  const imageList = document.querySelector('#image-list');
  const imageCount = document.querySelector('#image-count');
  const orderHint = document.querySelector('#order-hint');
  const emptyState = document.querySelector('#empty-state');
  const pageOptions = document.querySelector('#page-options');
  const optionCopy = document.querySelector('#option-copy');
  const pdfName = document.querySelector('#pdf-name');
  const exportButton = document.querySelector('#export-button');
  const exportLabel = document.querySelector('#export-label');
  const progressBox = document.querySelector('#progress-box');
  const progress = document.querySelector('#progress');
  const notice = document.querySelector('#notice');
  const previewDialog = document.querySelector('#preview-dialog');
  const previewCanvas = document.querySelector('#preview-canvas');
  const previewTitle = document.querySelector('#preview-title');
  const previewPosition = document.querySelector('#preview-position');
  const previewNotice = document.querySelector('#preview-notice');
  const previewPrev = document.querySelector('#preview-prev');
  const previewNext = document.querySelector('#preview-next');
  const rotateButton = document.querySelector('#rotate-button');
  const desktopHost = window.chrome?.webview;
  const filenameOrder = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });

  const modeDescriptions = {
    auto: '每页按图片方向选择横版或竖版，等比缩放并居中。',
    portrait: '所有页面统一为 A4 竖版，图片等比缩放并居中。',
    landscape: '所有页面统一为 A4 横版，图片等比缩放并居中。',
    image: '每页随图片宽高比设定大小，图片铺满页面。'
  };
  const rowActions = [['up', '上移'], ['down', '下移'], ['remove', '移除']];
  const items = [];
  let nextId = 1;
  let busy = false;
  let draggedRow = null;
  let dropTarget = null;
  let previewId = null;
  let previewRequest = 0;
  let readingClipboard = false;
  let clipboardRequest = 0;
  let pasteSequence = 0;

  function icon(name, size) {
    const namespace = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(namespace, 'svg');
    const attributes = { width: size, height: size, fill: 'none', stroke: 'currentColor',
      'stroke-width': '1.8', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true' };
    for (const [key, value] of Object.entries(attributes)) svg.setAttribute(key, value);
    const use = document.createElementNS(namespace, 'use');
    use.setAttribute('href', `#icon-${name}`);
    svg.append(use);
    return svg;
  }

  function setNotice(element, message = '', tone = '') {
    element.textContent = message;
    element.dataset.tone = tone;
  }

  function fileSize(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function renderList(focusId, focusAction) {
    const rows = document.createDocumentFragment();
    let focusButton;
    items.forEach(({ id, file, url, rotation }, index) => {
      const row = document.createElement('li');
      row.className = 'image-row';
      row.dataset.id = id;

      const grip = document.createElement('span');
      grip.className = 'drag-handle';
      grip.draggable = !busy && items.length > 1;
      grip.title = '拖动调整顺序';
      grip.append(icon('grip', 15), String(index + 1));

      const preview = document.createElement('img');
      preview.className = 'thumbnail';
      preview.alt = '';
      preview.loading = 'lazy';
      preview.decoding = 'async';
      preview.draggable = false;
      preview.src = url;
      preview.style.transform = `rotate(${rotation}deg)`;
      const previewButton = document.createElement('button');
      previewButton.type = 'button';
      previewButton.className = 'thumbnail-button';
      previewButton.dataset.action = 'preview';
      previewButton.setAttribute('aria-label', `预览第 ${index + 1} 张图片`);
      previewButton.title = '放大预览和旋转';
      previewButton.disabled = busy;
      previewButton.append(preview);

      const info = document.createElement('div');
      const name = document.createElement('span');
      name.className = 'file-name';
      name.textContent = file.name;
      name.title = file.name;
      const meta = document.createElement('span');
      meta.className = 'file-meta';
      meta.textContent = fileSize(file.size) + (rotation ? ` · 已旋转 ${rotation}°` : '');
      preview.addEventListener('error', () => { meta.textContent = '图片无法预览'; }, { once: true });
      info.append(name, meta);

      const actions = document.createElement('div');
      actions.className = 'row-actions';
      for (const [action, label] of rowActions) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'icon-button';
        button.dataset.action = action;
        button.title = label;
        button.setAttribute('aria-label', `${label}第 ${index + 1} 张图片`);
        button.disabled = busy || (action === 'up' && index === 0) || (action === 'down' && index === items.length - 1);
        button.append(icon(action, 16));
        actions.append(button);
        if (id === focusId && !button.disabled && (!focusButton || action === focusAction)) focusButton = button;
      }

      row.append(grip, previewButton, info, actions);
      rows.append(row);
    });
    imageList.replaceChildren(rows);
    imageList.hidden = items.length === 0;
    orderHint.hidden = imageList.hidden;
    listTools.hidden = imageList.hidden;
    sortButton.disabled = busy || items.length < 2;
    clearButton.disabled = busy || items.length === 0;
    emptyState.hidden = !imageList.hidden;
    const countText = `${items.length} 张图片`;
    if (imageCount.textContent !== countText) imageCount.textContent = countText;
    exportButton.disabled = busy || readingClipboard || items.length === 0;
    if (focusId != null) (focusButton || pickButton).focus();
  }

  function addFiles(files) {
    if (busy) return;
    const rejected = [];
    for (const file of files) {
      const supported = /\.(jpe?g|jfif|png|webp|bmp)$/i.test(file.name) || /^(image\/(jpeg|png|webp|bmp|x-ms-bmp))$/i.test(file.type);
      if (!supported || file.size === 0) {
        rejected.push(file.name);
        continue;
      }
      items.push({ id: nextId++, file, url: URL.createObjectURL(file), rotation: 0 });
    }
    const skipped = rejected.slice(0, 3).join('、');
    const more = rejected.length > 3 ? `等 ${rejected.length} 个文件` : '';
    setNotice(fileNotice, rejected.length ? `已跳过空文件或不支持的格式：${skipped}${more}` : '', 'error');
    setNotice(notice);
    renderList();
  }

  function moveItem(from, to, focusAction) {
    if (from < 0 || to < 0 || to >= items.length || from === to) return;
    const [item] = items.splice(from, 1);
    items.splice(to, 0, item);
    setNotice(notice);
    renderList(focusAction ? item.id : undefined, focusAction);
  }

  async function updatePreview() {
    const index = items.findIndex(item => item.id === previewId);
    if (index < 0 || !previewDialog.open) return;
    const item = items[index];
    const rotation = item.rotation;
    const request = ++previewRequest;
    previewTitle.textContent = item.file.name;
    previewTitle.title = item.file.name;
    previewPosition.textContent = `${index + 1} / ${items.length}`;
    previewPrev.disabled = index === 0;
    previewNext.disabled = index === items.length - 1;
    rotateButton.disabled = true;
    previewCanvas.width = previewCanvas.height = 1;
    setNotice(previewNotice, '正在加载预览…');
    const image = new Image();
    image.src = item.url;
    try {
      await image.decode();
      if (request !== previewRequest || !previewDialog.open) return;
      const swap = rotation % 180 !== 0;
      const width = swap ? image.naturalHeight : image.naturalWidth;
      const height = swap ? image.naturalWidth : image.naturalHeight;
      const scale = Math.min(1, 2048 / Math.max(width, height));
      previewCanvas.width = Math.max(1, Math.round(width * scale));
      previewCanvas.height = Math.max(1, Math.round(height * scale));
      const context = previewCanvas.getContext('2d');
      context.fillStyle = '#fff';
      context.fillRect(0, 0, previewCanvas.width, previewCanvas.height);
      context.translate(previewCanvas.width / 2, previewCanvas.height / 2);
      context.rotate(rotation * Math.PI / 180);
      context.drawImage(image, -image.naturalWidth * scale / 2, -image.naturalHeight * scale / 2,
        image.naturalWidth * scale, image.naturalHeight * scale);
      rotateButton.disabled = false;
      setNotice(previewNotice, rotation ? `已顺时针旋转 ${rotation}°，导出时应用此方向。` : '');
    } catch {
      if (request === previewRequest) setNotice(previewNotice, '图片无法预览，请检查文件是否能正常打开。', 'error');
    } finally {
      image.src = '';
    }
  }

  function openPreview(id) {
    previewId = id;
    previewDialog.showModal();
    updatePreview();
  }

  function movePreview(offset) {
    const index = items.findIndex(item => item.id === previewId) + offset;
    if (index < 0 || index >= items.length) return;
    previewId = items[index].id;
    updatePreview();
  }

  document.querySelector('#preview-close').addEventListener('click', () => previewDialog.close());
  previewDialog.addEventListener('close', () => {
    const opener = imageList.querySelector(`[data-id="${previewId}"] .thumbnail-button`);
    previewId = null;
    previewRequest++;
    previewCanvas.width = previewCanvas.height = 1;
    opener?.focus();
  });
  previewPrev.addEventListener('click', () => movePreview(-1));
  previewNext.addEventListener('click', () => movePreview(1));
  previewDialog.addEventListener('keydown', event => {
    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
      event.preventDefault();
      movePreview(event.key === 'ArrowLeft' ? -1 : 1);
    }
  });
  rotateButton.addEventListener('click', () => {
    const item = items.find(item => item.id === previewId);
    if (!item || busy) return;
    item.rotation = (item.rotation + 90) % 360;
    setNotice(notice);
    renderList();
    updatePreview();
  });

  sortButton.addEventListener('click', () => {
    if (busy) return;
    items.sort((left, right) => filenameOrder.compare(left.file.name, right.file.name));
    renderList();
    setNotice(notice);
    setNotice(fileNotice, '已按文件名排序，数字按 1、2、10 的顺序排列。');
  });
  clearButton.addEventListener('click', () => {
    if (busy) return;
    if (previewDialog.open) previewDialog.close();
    for (const item of items) URL.revokeObjectURL(item.url);
    items.length = 0;
    clipboardRequest++;
    finishClipboard();
    endDrag();
    fileInput.value = '';
    setNotice(fileNotice, '已清空列表。');
    setNotice(notice);
    renderList();
    pickButton.focus();
  });

  function clipboardFile(blob) {
    const extension = blob.type.split('/')[1].replace('jpeg', 'jpg').replace('x-ms-bmp', 'bmp');
    const timestamp = new Date().toISOString().replace(/[-:.TZ]/g, '');
    return new File([blob], `粘贴图片-${timestamp}-${++pasteSequence}.${extension}`, { type: blob.type });
  }

  function finishClipboard() {
    readingClipboard = false;
    pasteButton.disabled = busy;
    exportButton.disabled = busy || items.length === 0;
  }

  document.addEventListener('paste', event => {
    if (busy) return;
    const images = Array.from(event.clipboardData?.items || [])
      .filter(item => /^image\/(png|jpeg|webp|bmp|x-ms-bmp)$/.test(item.type))
      .map(item => item.getAsFile()).filter(Boolean);
    if (images.length === 0) return;
    event.preventDefault();
    addFiles(images.map(clipboardFile));
  });
  pasteButton.addEventListener('click', async () => {
    if (busy || readingClipboard) return;
    setNotice(fileNotice);
    const requestId = ++clipboardRequest;
    if (desktopHost) {
      readingClipboard = true;
      pasteButton.disabled = true;
      exportButton.disabled = true;
      desktopHost.postMessage({ type: 'paste-image', requestId });
      return;
    }
    if (!navigator.clipboard?.read) {
      setNotice(fileNotice, '请点击页面后按 Ctrl+V 或 ⌘V 粘贴图片。');
      return;
    }
    readingClipboard = true;
    pasteButton.disabled = true;
    exportButton.disabled = true;
    try {
      const entries = await navigator.clipboard.read();
      const images = [];
      for (const entry of entries) {
        const type = entry.types.find(type => /^image\/(png|jpeg|webp|bmp|x-ms-bmp)$/.test(type));
        if (type) images.push(clipboardFile(await entry.getType(type)));
      }
      if (requestId !== clipboardRequest) return;
      if (images.length) addFiles(images);
      else setNotice(fileNotice, '剪贴板里没有可用图片，请先复制截图或图片。');
    } catch {
      if (requestId === clipboardRequest) setNotice(fileNotice, '剪贴板暂时无法读取。请点击页面后按 Ctrl+V 或 ⌘V，或选择图片。');
    } finally {
      if (requestId === clipboardRequest) finishClipboard();
    }
  });
  desktopHost?.addEventListener('message', event => {
    const message = event.data;
    if (!readingClipboard || message?.requestId !== clipboardRequest) return;
    if (message?.type === 'clipboard-image') {
      try {
        const base64 = message.dataUrl.split(',')[1];
        const bytes = Uint8Array.from(atob(base64), byte => byte.charCodeAt(0));
        addFiles([new File([bytes], message.name, { type: 'image/png' })]);
      } catch {
        setNotice(fileNotice, '粘贴失败，请重新复制截图后再试。', 'error');
      } finally {
        finishClipboard();
      }
    } else if (message?.type === 'clipboard-error') {
      setNotice(fileNotice, message.message, 'error');
      finishClipboard();
    }
  });

  function clearDropTarget() {
    dropTarget?.classList.remove('drop-before', 'drop-after');
    dropTarget = null;
  }

  function endDrag() {
    draggedRow?.classList.remove('dragging');
    draggedRow = null;
    clearDropTarget();
  }

  pickButton.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  });

  for (const eventName of ['dragover', 'drop']) {
    document.addEventListener(eventName, event => {
      if (event.dataTransfer.types.includes('Files')) event.preventDefault();
    });
  }
  dropZone.addEventListener('dragover', event => {
    if (busy || !event.dataTransfer.types.includes('Files')) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'copy';
    dropZone.classList.add('is-over');
  });
  dropZone.addEventListener('dragleave', event => {
    if (!dropZone.contains(event.relatedTarget)) dropZone.classList.remove('is-over');
  });
  dropZone.addEventListener('drop', event => {
    dropZone.classList.remove('is-over');
    if (event.dataTransfer.files.length === 0) return;
    event.preventDefault();
    addFiles(event.dataTransfer.files);
  });

  imageList.addEventListener('click', event => {
    const button = event.target.closest('button[data-action]');
    if (!button || busy) return;
    const id = Number(button.closest('li').dataset.id);
    const index = items.findIndex(item => item.id === id);
    if (index === -1) return;
    if (button.dataset.action === 'preview') {
      openPreview(id);
      return;
    }
    if (button.dataset.action === 'remove') {
      const [item] = items.splice(index, 1);
      URL.revokeObjectURL(item.url);
      setNotice(notice);
      renderList((items[index] || items[index - 1])?.id ?? id, 'remove');
      return;
    }
    const offset = button.dataset.action === 'up' ? -1 : 1;
    moveItem(index, index + offset, button.dataset.action);
  });

  imageList.addEventListener('dragstart', event => {
    const handle = event.target.closest('.drag-handle');
    if (!handle || !handle.draggable || busy) return;
    draggedRow = handle.closest('li');
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('text/plain', draggedRow.dataset.id);
    draggedRow.classList.add('dragging');
  });
  imageList.addEventListener('dragover', event => {
    if (!draggedRow) return;
    const row = event.target.closest('.image-row');
    clearDropTarget();
    if (!row || row === draggedRow) return;
    event.preventDefault();
    event.dataTransfer.dropEffect = 'move';
    dropTarget = row;
    const box = row.getBoundingClientRect();
    row.classList.add(event.clientY < box.top + box.height / 2 ? 'drop-before' : 'drop-after');
  });
  imageList.addEventListener('dragleave', event => {
    if (!imageList.contains(event.relatedTarget)) clearDropTarget();
  });
  imageList.addEventListener('dragend', endDrag);
  imageList.addEventListener('drop', event => {
    if (!draggedRow || !dropTarget) return;
    event.preventDefault();
    const source = items.findIndex(item => item.id === Number(draggedRow.dataset.id));
    const target = items.findIndex(item => item.id === Number(dropTarget.dataset.id));
    const insertion = target + (dropTarget.classList.contains('drop-after') ? 1 : 0);
    endDrag();
    moveItem(source, insertion - (source < insertion ? 1 : 0));
  });

  pageOptions.addEventListener('change', event => {
    optionCopy.textContent = modeDescriptions[event.target.value];
    setNotice(notice);
  });
  pdfName.addEventListener('input', () => setNotice(notice));

  function downloadName(value) {
    let name = value.trim().replace(/(?:\.pdf)+$/i, '').replace(/[<>:"/\\|?*\u0000-\u001f]/g, '_').replace(/[. ]+$/, '');
    if (/^(CON|PRN|AUX|NUL|COM[1-9¹²³]|LPT[1-9¹²³])(?:\.|$)/i.test(name)) name = `_${name}`;
    return `${name || '合并图片'}.pdf`;
  }

  function setBusy(value) {
    busy = value;
    pickButton.disabled = value;
    pasteButton.disabled = value || readingClipboard;
    fileInput.disabled = value;
    pageOptions.disabled = value;
    pdfName.disabled = value;
    progressBox.hidden = !value;
    renderList();
  }

  exportButton.addEventListener('click', async () => {
    if (busy || items.length === 0) return;
    const files = items.map(({ file, rotation }) => ({ file, rotation }));
    const pageMode = pageOptions.querySelector('input:checked').value;
    const name = downloadName(pdfName.value);
    progress.max = files.length;
    progress.value = 0;
    setNotice(notice);
    setBusy(true);
    exportLabel.textContent = `正在生成 0 / ${files.length}`;

    try {
      const blob = await buildImagePdf(files, {
        pageMode,
        onProgress(completed, total) {
          progress.value = completed;
          exportLabel.textContent = `正在生成 ${completed} / ${total}`;
        }
      });
      const url = URL.createObjectURL(blob);
      const download = document.createElement('a');
      download.href = url;
      download.download = name;
      document.body.append(download);
      download.click();
      download.remove();
      window.setTimeout(() => URL.revokeObjectURL(url), 60_000);
      setNotice(notice, `已生成 ${name}，共 ${files.length} 页（${fileSize(blob.size)}）。`);
    } catch (error) {
      setNotice(notice, error.message || '生成失败，请检查图片后重试。', 'error');
    } finally {
      setBusy(false);
      exportLabel.textContent = '生成并下载 PDF';
      exportButton.focus();
    }
  });
  </script>
</body>
</html>
